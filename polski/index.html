<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тесты по польскому</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🇵🇱</text></svg>'>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#000000; --panel:#121216; --line:#43434e;
  --text:#f6f1e3; --acc:#ffd000;
}
*{box-sizing:border-box}
html{background:var(--bg);font-size:22px}
@media (max-width:520px){html{font-size:19px}}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Atkinson Hyperlegible','Avenir Next',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:46rem;margin:0 auto;padding:2rem 1rem 4rem}
h1{font-size:1.9rem;line-height:1.25;margin:0 0 .3rem}
.sub{font-size:1.15rem;font-weight:700;margin:0 0 2rem}
:focus-visible{outline:4px solid var(--acc);outline-offset:4px;border-radius:12px}
.tests{display:flex;flex-direction:column;gap:1rem;list-style:none;margin:0;padding:0}
a.test{display:flex;gap:1.1rem;align-items:center;color:var(--text);text-decoration:none;
  background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:1.2rem 1.3rem}
a.test:hover{border-color:var(--acc)}
.num{flex:0 0 auto;width:3.4rem;height:3.4rem;display:grid;place-items:center;
  background:var(--acc);color:#000;font-size:1.6rem;font-weight:800;border-radius:14px}
.tinfo{flex:1 1 auto;min-width:0}
.tname{display:block;font-size:1.4rem;font-weight:700;line-height:1.3;margin:0 0 .3rem}
.tmeta{display:block;font-size:1.05rem;margin:0}
.arrow{flex:0 0 auto;font-size:1.9rem;font-weight:800;color:var(--acc)}
</style>
</head>
<body>
<main class="wrap">
  <h1>Тесты по польскому</h1>
  <p class="sub" lang="pl">Testy z języka polskiego</p>
  <ul class="tests">
    <li>
      <a class="test" href="test-1.html">
        <span class="num" aria-hidden="true">1</span>
        <span class="tinfo">
          <span class="tname"><span lang="pl">Test plasujący</span> · уровни A1–C1</span>
          <span class="tmeta">88 вопросов · балл, рекомендуемая группа, разбор ошибок, отчёт в PDF</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <!-- Шаблон следующего теста: скопируй блок <li>…</li> выше,
         поменяй href на test-2.html, номер в .num и описание. -->
  </ul>
</main>
</body>
</html>
