<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test plasujący — польский</title>
</head>
<body>
<!--BODY-START-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&display=swap">
<style>
:root{
  --bg:#000000; --panel:#121216; --panel2:#1c1c22; --line:#43434e;
  --text:#f6f1e3; --dim:#f6f1e3;
  --acc:#ffd000; --ok:#0a8ed0; --bad:#d42a6b;
}
*{box-sizing:border-box}
html{background:var(--bg);font-size:20px}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Atkinson Hyperlegible','Avenir Next',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:46rem;margin:0 auto;padding:1rem 1rem 5rem}
h1{font-size:1.6rem;line-height:1.25;text-wrap:balance;margin:.4rem 0 .6rem}
h2{font-size:1.35rem;margin:.9rem 0 .5rem}
p{margin:.5rem 0}
.dim{color:var(--dim)}
.pl{font-style:normal}
:focus-visible{outline:4px solid var(--acc);outline-offset:3px;border-radius:10px}
button{font:inherit}
.btn{display:inline-block;font-weight:700;background:var(--panel);color:var(--text);
  border:3px solid var(--line);border-radius:14px;padding:.75rem 1.15rem;font-size:1.05rem;
  cursor:pointer;min-height:3rem}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#000}
.btn.primary:hover{background:#ffdd45;border-color:#ffdd45}
.btn.danger{border-color:var(--line);color:var(--bad)}
.btn.small{font-size:.95rem;padding:.5rem .8rem;min-height:2.4rem}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin:.9rem 0}
.row.space{justify-content:space-between}
.pbar{height:.7rem;background:var(--panel2);border-radius:.35rem;margin:.5rem 0 .2rem;overflow:hidden}
.pfill{height:100%;background:var(--acc);border-radius:.35rem}
.qhead{font-size:1.05rem;font-weight:700;color:var(--dim);margin-top:.8rem}
.qtext{font-size:1.45rem;font-weight:700;line-height:1.5;white-space:pre-line;margin:.7rem 0 1rem}
.opts{display:flex;flex-direction:column;gap:.75rem;margin:0 0 1.1rem}
.opt{display:flex;gap:.9rem;align-items:flex-start;width:100%;text-align:left;
  font-size:1.3rem;line-height:1.45;padding:.9rem 1rem;background:var(--panel);
  color:var(--text);border:3px solid var(--line);border-radius:16px;cursor:pointer}
.opt:hover{border-color:var(--dim)}
.opt .k{flex:0 0 auto;min-width:2.3rem;text-align:center;font-weight:800;
  background:var(--panel2);border-radius:10px;padding:.1rem .3rem}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--panel2)}
.opt[aria-pressed="true"] .k{background:var(--acc);color:#000}
.opt .sel{margin-left:auto;color:var(--acc);font-weight:800;visibility:hidden;flex:0 0 auto}
.opt[aria-pressed="true"] .sel{visibility:visible}
.opt.ro{cursor:default}
.opt.right{border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#000}
.opt.wrong{border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
textarea.open{width:100%;font-size:1.3rem;font-family:inherit;background:var(--panel);
  color:var(--text);border:3px solid var(--line);border-radius:14px;padding:.9rem;min-height:4.6rem}
::placeholder{color:var(--text);font-style:italic;opacity:1}
.dia{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 1rem}
.dia button{font-size:1.25rem;min-width:2.7rem;min-height:2.7rem;background:var(--panel2);
  color:var(--text);border:2px solid var(--line);border-radius:10px;cursor:pointer;font-weight:700}
.vd{display:inline-block;font-size:1.25rem;font-weight:800;border-radius:12px;padding:.35rem .9rem;margin:.4rem 0}
.vd.ok{background:var(--ok);color:#000}
.vd.bad{background:var(--bad);color:#fff}
.vd.none{background:var(--panel2);color:var(--dim)}
.ansline{font-size:1.25rem;margin:.4rem 0}
.grid{display:flex;flex-wrap:wrap;gap:.55rem;margin:.5rem 0 1rem}
.cell{width:3.1rem;height:3.1rem;font-size:1.1rem;font-weight:800;border-radius:12px;
  border:3px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.cell.done{background:var(--acc);border-color:var(--acc);color:#000}
.cell.cur{border-color:#ffffff}
.cell.okc{background:var(--panel);border-color:var(--ok);color:var(--text)}
.cell.badc{background:var(--bad);border-color:var(--bad);color:#fff}
.bigscore{font-size:3.6rem;font-weight:800;line-height:1.1;margin:.6rem 0 .2rem;color:var(--acc)}
.lvl{display:inline-block;font-size:2rem;font-weight:800;background:var(--acc);color:#000;
  border-radius:16px;padding:.3rem 1.1rem;margin:.4rem 0}
.stats{font-size:1.25rem;line-height:1.8;margin:.6rem 0}
.card{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin:.9rem 0}
input.name{font:inherit;font-size:1.2rem;width:100%;background:var(--panel);color:var(--text);
  border:3px solid var(--line);border-radius:12px;padding:.7rem .9rem}
label.chk{display:flex;gap:.6rem;align-items:center;font-size:1.05rem;cursor:pointer}
label.chk input{width:1.5rem;height:1.5rem;accent-color:var(--acc)}
.homelink{display:inline-block;color:var(--text);font-size:1.05rem;font-weight:700;
  margin:.1rem 0 .5rem;text-decoration:underline;text-underline-offset:3px;border-radius:8px}
.kbd{font-size:.95rem;color:var(--dim)}
.kbd b{color:var(--text);background:var(--panel2);border-radius:6px;padding:0 .4rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- report (dark by default, .rep-light for print/sharing) ---------- */
#report{display:none;
  --sh-bg:#000000; --sh-ink:#f4efe2; --sh-dim:#f4efe2; --sh-line:#7c776a; --sh-panel:#1c1c22;
  --pen:#ffd000; --penok:#0a8ed0; --penbad:#d42a6b; --pennone:#f4efe2;
  --mkok:#0a8ed0; --sh-acc:#ffd000}
#report.rep-light{
  --sh-bg:#ffffff; --sh-ink:#111; --sh-dim:#555; --sh-line:#333; --sh-panel:#eee;
  --pen:#1d4ed8; --penok:#15803d; --penbad:#b91c1c; --pennone:#8a8a8a;
  --mkok:#15803d; --sh-acc:#111}
#report.active{display:block}
.sheet{background:var(--sh-bg);color:var(--sh-ink);margin:1.1rem auto;max-width:880px;
  box-shadow:0 6px 28px rgba(0,0,0,.55);
  print-color-adjust:exact;-webkit-print-color-adjust:exact}
#report:not(.rep-light) .sheet{border:1px solid #2c2c33}
.pgwrap{position:relative;container-type:inline-size;background:var(--sh-bg)}
.pgwrap img{display:block;width:100%;height:auto}
#report:not(.rep-light) .pgwrap img{filter:invert(1);mix-blend-mode:screen}
.mk{position:absolute;transform:translate(-108%,-50%);font-weight:800;font-size:2cqw;line-height:1}
.mk.ok{color:var(--mkok)}
.mk.bad{color:var(--penbad)}
.mk.none{color:var(--pennone)}
.circ{position:absolute;border:.34cqw solid var(--pen);border-radius:50%}
.circ.corr{border:.3cqw dashed var(--penok);border-radius:14px}
.hand{position:absolute;font-family:'Caveat','Segoe Print',cursive;color:var(--pen);
  font-size:2.4cqw;line-height:1;white-space:nowrap}
.pnote{position:absolute;color:var(--penok);font-size:1.45cqw;line-height:1.1;white-space:nowrap;
  font-family:'Atkinson Hyperlegible',sans-serif}
.cover{padding:7% 8%;font-family:'Atkinson Hyperlegible',sans-serif}
.cover h1{font-size:1.5rem;margin:0 0 .2rem;color:var(--sh-ink)}
.cover .sub{color:var(--sh-dim);margin:0 0 1.4rem}
.cover .field{font-size:1.05rem;margin:.45rem 0}
.cover .score{font-size:2.1rem;font-weight:800;margin:.8rem 0 .2rem;color:var(--sh-acc)}
.cover .lvlp{font-size:1.5rem;font-weight:800;margin:.2rem 0 1.2rem}
.cover table{border-collapse:collapse;margin:.6rem 0 1.2rem;font-size:1rem}
.cover th,.cover td{border:1.5px solid var(--sh-line);padding:.35rem .8rem;text-align:left}
.cover th{background:var(--sh-panel)}
.cover .legend{font-size:.9rem;color:var(--sh-dim);line-height:1.6;border-top:1.5px solid var(--sh-line);padding-top:.8rem}
.cover .legend .c{display:inline-block;width:1.05em;height:1.05em;border:2px solid var(--pen);
  border-radius:50%;vertical-align:-.18em}
.cover .legend .d{display:inline-block;width:1.05em;height:1.05em;border:2px dashed var(--penok);
  border-radius:5px;vertical-align:-.18em}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;
  align-items:center;justify-content:center;padding:1rem}
.mbox{background:var(--panel);border:3px solid var(--acc);border-radius:18px;
  padding:1.3rem 1.4rem;max-width:32rem;font-size:1.3rem;line-height:1.5}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  #app,.noprint{display:none !important}
  #report{display:block !important}
  .sheet{box-shadow:none;margin:0;max-width:none;width:210mm;min-height:296mm;
    border:none !important;break-after:page}
  .sheet:last-child{break-after:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (max-width:520px){
  html{font-size:17px}
  .cell{width:2.7rem;height:2.7rem}
  .scale-label{display:none}
}
</style>

/* ---------- state ---------- */
const LS="plq-v1";
const params=new URLSearchParams(location.search);
const MEM_ONLY=params.has("demo");
let S={ans:{},ov:{},idx:0,name:"",scale:1.25,done:false};
function save(){if(MEM_ONLY)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function load(){if(MEM_ONLY)return;try{const s=localStorage.getItem(LS);if(s)S={...S,...JSON.parse(s)}}catch(e){}}
load();
const Q=DATA.qs, N=Q.length;
const BANDS=[[1,14,"A1"],[15,33,"A2"],[34,53,"B1"],[54,73,"B2"],[74,88,"C1"]];
const LEVELS=["A1","A2","B1","B2","C1"];
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).toLowerCase().replace(/\s+/g," ").trim();
function answered(q){const a=S.ans[q.id];return a!=null&&String(a).trim()!==""}
function isCorrect(q){
  if(!answered(q))return false;
  const a=S.ans[q.id];
  if(q.type==="mcq")return a===q.answer;
  if(S.ov[q.id])return true;
  const n=norm(a);
  return q.accept.some(x=>n.includes(norm(x)));
}
function tally(){
  let score=0,ansd=0;const per={};LEVELS.forEach(l=>per[l]={ok:0,total:0});
  for(const q of Q){per[q.level].total++;if(answered(q))ansd++;if(isCorrect(q)){score++;per[q.level].ok++}}
  let lvl="A1";for(const[lo,hi,l]of BANDS){if(score>=lo&&score<=hi)lvl=l}
  return{score,ansd,per,lvl,pct:Math.round(score/N*100)};
}
function setScale(v){
  S.scale=Math.min(2,Math.max(.9,v));
  document.documentElement.style.fontSize=(20*S.scale)+"px";save();
  const el=$("#scaleval");if(el)el.textContent=Math.round(S.scale*100)+"%";
}
function announce(t){$("#live").textContent=t}
function ask(msg,yesLabel,onYes){
  const m=$("#modal");
  m.innerHTML=`<div class="mbox" role="alertdialog" aria-modal="true" aria-label="Подтверждение">
    <p>${esc(msg)}</p>
    <div class="row">
      <button class="btn primary" data-m="yes">${esc(yesLabel)}</button>
      <button class="btn" data-m="no">Отмена</button>
    </div></div>`;
  m.style.display="flex";
  m.querySelector('[data-m="yes"]').focus();
  m.onclick=e=>{
    const b=e.target.closest("[data-m]");
    if(e.target===m||(b&&b.dataset.m==="no")){closeModal();return}
    if(b&&b.dataset.m==="yes"){closeModal();onYes()}
  };
}
function closeModal(){const m=$("#modal");m.style.display="none";m.onclick=null;m.innerHTML=""}
/* ---------- views ---------- */
let view="start";
function show(v){view=v;render();window.scrollTo(0,0)}
function render(){
  $("#report").classList.toggle("active",view==="report");
  const app=$("#app");
  app.style.display=view==="report"?"none":"block";
  if(view==="start")app.innerHTML=vStart();
  else if(view==="quiz")app.innerHTML=vQuiz();
  else if(view==="grid")app.innerHTML=vGrid();
  else if(view==="results")app.innerHTML=vResults();
  else if(view==="review")app.innerHTML=vReview();
  else if(view==="report"){buildReport();$("#report").scrollIntoView()}
  const h=$("#app h1")||$("#app h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}
}
function scaleRow(){
  return `<div class="row noprint" style="justify-content:flex-end;margin:.2rem 0;flex-wrap:nowrap">
    <span class="dim scale-label">Шрифт:</span>
    <button class="btn small" data-act="a-">A−</button>
    <span id="scaleval">${Math.round(S.scale*100)}%</span>
    <button class="btn small" data-act="a+">A+</button></div>`;
}
const HOME="./";
function vStart(){
  const cont=Object.keys(S.ans).length>0;
  return `${scaleRow()}
  ${HOME?`<a class="homelink" href="${HOME}">← Все тесты</a>`:""}
  <h1>Тест на уровень польского<br><span class="dim" lang="pl">Test plasujący z języka polskiego</span></h1>
  <p>88 вопросов от A1 до C1: в большинстве выбираешь один из трёх вариантов, в девяти надо вписать слово. Ответы сохраняются в браузере автоматически, можно прерваться и вернуться.</p>
  <p>В конце: балл, рекомендуемый уровень группы, разбор ошибок и отчёт в PDF с пометками на оригинальных страницах теста.</p>
  <div class="card">
    <label for="nm">Имя для отчёта (необязательно):</label>
    <input id="nm" class="name" value="${esc(S.name)}" autocomplete="name" placeholder="Imię i nazwisko">
  </div>
  <p class="kbd">Клавиши: <b>1</b> <b>2</b> <b>3</b> или <b>a</b> <b>b</b> <b>c</b> — выбрать, <b>←</b> <b>→</b> — между вопросами.</p>
  <div class="row">
    ${cont?`<button class="btn primary" data-act="continue">Продолжить (вопрос ${S.idx+1})</button>
            <button class="btn" data-act="results">К результатам</button>
            <button class="btn danger" data-act="reset">Начать заново</button>`
          :`<button class="btn primary" data-act="start">Начать тест</button>`}
  </div>`;
}
function qNav(prevAct,nextAct,nextLabel){
  return `<div class="row space">
    <button class="btn" data-act="${prevAct}" ${S.idx===0?"disabled":""}>← Назад</button>
    <button class="btn primary" data-act="${nextAct}">${nextLabel}</button>
  </div>
  <div class="row">
    <button class="btn small" data-act="grid">Все вопросы</button>
    <button class="btn small" data-act="finish">Завершить тест</button>
    <button class="btn small" data-act="home">На главную</button>
  </div>`;
}
function vQuiz(){
  const q=Q[S.idx];
  const t=tally();
  let body="";
  if(q.type==="mcq"){
    body=`<div class="opts" role="group" aria-label="Варианты ответа">`+q.options.map(o=>
      `<button class="opt" data-act="pick" data-k="${o.k}" aria-pressed="${S.ans[q.id]===o.k}">
        <span class="k">${o.k}</span><span lang="pl">${esc(o.text)}</span><span class="sel">✓</span>
      </button>`).join("")+`</div>`;
  }else{
    body=`<textarea class="open" id="openinp" lang="pl" autocapitalize="off" autocomplete="off"
      placeholder="Впиши ответ по-польски…">${esc(S.ans[q.id]||"")}</textarea>
    <div class="dia" aria-label="Польские буквы">${"ąćęłńóśźż".split("").map(c=>
      `<button data-act="dia" data-c="${c}">${c}</button>`).join("")}</div>`;
  }
  const nextLabel=S.idx===N-1?"Завершить →":(answered(q)?"Далее →":"Пропустить →");
  return `${scaleRow()}
  <div class="qhead">Вопрос ${S.idx+1} из ${N} · отвечено ${t.ansd}</div>
  <div class="pbar"><div class="pfill" style="width:${t.ansd/N*100}%"></div></div>
  <h2 class="qtext" lang="pl">${esc(q.text)}</h2>
  ${body}
  ${qNav("prev",S.idx===N-1?"finish":"next",nextLabel)}`;
}
function vGrid(){
  const done=S.done;
  let html=`${scaleRow()}<h1>Все вопросы</h1><p class="dim">Жёлтые — с ответом. Нажми, чтобы перейти.</p>`;
  for(const[lo,hi,l]of BANDS){
    html+=`<h2>${l} · ${lo}–${hi}</h2><div class="grid">`;
    for(let i=lo;i<=hi;i++){
      const q=Q[i-1];
      let cls="cell";
      if(done){cls+=answered(q)?(isCorrect(q)?" okc":" badc"):""}
      else if(answered(q))cls+=" done";
      if(i-1===S.idx)cls+=" cur";
      html+=`<button class="${cls}" data-act="jump" data-i="${i-1}" aria-label="Вопрос ${i}">${i}</button>`;
    }
    html+=`</div>`;
  }
  const t=tally();
  html+=`<div class="row">
    <button class="btn primary" data-act="back-question">К вопросу ${S.idx+1}</button>
    <button class="btn" data-act="finish">Завершить тест (${t.ansd}/${N})</button>
    <button class="btn small" data-act="home">На главную</button></div>`;
  return html;
}
function vResults(){
  const t=tally();
  const skipped=N-t.ansd;
  return `${scaleRow()}
  <h1>Результат</h1>
  <div class="bigscore">${t.score} / ${N}</div>
  <p class="dim" style="font-size:1.2rem">правильных ответов · ${t.pct}%</p>
  <p style="font-size:1.3rem;margin-top:1rem">Рекомендуемая группа:</p>
  <span class="lvl">${t.lvl}</span>
  <div class="stats">${LEVELS.map(l=>`${l}: ${t.per[l].ok} из ${t.per[l].total}`).join("<br>")}</div>
  ${skipped?`<p class="dim">Без ответа: ${skipped}</p>`:""}
  <div class="row">
    <button class="btn primary" data-act="review">Разбор ответов</button>
    <button class="btn" data-act="report">Отчёт (PDF)</button>
  </div>
  <div class="row">
    <button class="btn small" data-act="back-quiz">Вернуться к тесту</button>
    <button class="btn small" data-act="grid">Все вопросы</button>
    <button class="btn small danger" data-act="reset">Начать заново</button>
    <button class="btn small" data-act="home">На главную</button>
  </div>`;
}
let onlyErrors=false;
function reviewIds(){
  return Q.filter(q=>!onlyErrors||!isCorrect(q)).map(q=>q.id-1);
}
function vReview(){
  const q=Q[S.idx];
  const ok=isCorrect(q),ans=answered(q);
  const ids=reviewIds();
  const pos=ids.indexOf(S.idx);
  let body="";
  if(q.type==="mcq"){
    body=`<div class="opts">`+q.options.map(o=>{
      let cls="opt ro";
      if(o.k===q.answer)cls+=" right";
      else if(S.ans[q.id]===o.k)cls+=" wrong";
      return `<div class="${cls}"><span class="k">${o.k}</span><span lang="pl">${esc(o.text)}</span>
        ${o.k===q.answer?'<span class="sel" style="visibility:visible;color:var(--ok)">✓ верный</span>':""}
        ${S.ans[q.id]===o.k&&o.k!==q.answer?'<span class="sel" style="visibility:visible;color:var(--bad)">твой выбор</span>':""}
      </div>`;}).join("")+`</div>`;
  }else{
    body=`<div class="ansline">Твой ответ: <b lang="pl">${ans?esc(S.ans[q.id]):"—"}</b></div>
    <div class="ansline">Ожидалось: <b lang="pl" style="color:var(--ok)">${esc(q.display)}</b></div>
    ${q.full?`<p class="dim" lang="pl">${esc(q.full)}</p>`:""}
    ${ans&&!ok?`<button class="btn small" data-act="override">Зачесть как верный</button>`:""}
    ${S.ov[q.id]?`<button class="btn small" data-act="override">Отменить зачёт (сейчас зачтено)</button>`:""}`;
  }
  return `${scaleRow()}
  <div class="qhead">Разбор · вопрос ${S.idx+1} из ${N}${onlyErrors?` · ошибка ${pos+1} из ${ids.length}`:""}</div>
  <div class="${ok?"vd ok":(ans?"vd bad":"vd none")}">${ok?"✓ Верно":(ans?"✗ Неверно":"— Без ответа")}</div>
  <h2 class="qtext" lang="pl">${esc(q.text)}</h2>
  ${body}
  <label class="chk"><input type="checkbox" id="onlyerr" ${onlyErrors?"checked":""}> показывать только ошибки</label>
  <div class="row space">
    <button class="btn" data-act="rprev" ${pos<=0?"disabled":""}>← Назад</button>
    <button class="btn primary" data-act="rnext" ${pos>=ids.length-1?"disabled":""}>Далее →</button>
  </div>
  <div class="row">
    <button class="btn small" data-act="results">К результатам</button>
    <button class="btn small" data-act="grid">Все вопросы</button>
  </div>`;
}
/* ---------- report ---------- */
function buildReport(){
  const t=tally();
  $("#report").classList.toggle("rep-light",!!S.repLight);
  const today=new Date().toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"});
  const anyOv=Q.some(q=>S.ov[q.id]);
  let html=`<div class="wrap noprint">
    <h1 style="color:var(--text)">Отчёт</h1>
    <div class="row" role="group" aria-label="Тема отчёта">
      <span class="dim">Тема:</span>
      <button class="btn small${S.repLight?"":" primary"}" data-act="rep-theme" data-t="dark" aria-pressed="${!S.repLight}">Тёмная</button>
      <button class="btn small${S.repLight?" primary":""}" data-act="rep-theme" data-t="light" aria-pressed="${!!S.repLight}">Светлая</button>
    </div>
    <p style="color:var(--dim)">Тёмная: читать самому. Светлая: как оригинал, для печати или отправки преподавателю. PDF сохранится в выбранной теме.</p>
    <p style="color:var(--dim)">Нажми кнопку и в диалоге печати выбери «Сохранить как PDF». Если диалог не открывается (такое бывает во встроенном предпросмотре), открой этот файл на сайте или с диска.</p>
    <div class="row">
      <button class="btn primary" data-act="print">🖨 Сохранить как PDF</button>
      <button class="btn" data-act="results">← К результатам</button>
    </div></div>`;
  html+=`<div class="sheet"><div class="cover" lang="pl">
    <h1>Wynik testu plasującego</h1>
    <p class="sub">Test plasujący z języka polskiego dla obcokrajowców</p>
    <p class="field"><b>Imię i nazwisko:</b> ${esc(S.name)||"________________________"}</p>
    <p class="field"><b>Data:</b> ${today}</p>
    <div class="score">${t.score} / ${N} pkt (${t.pct}%)</div>
    <div class="lvlp">Rekomendowany poziom grupy: ${t.lvl}</div>
    <table><tr><th>Poziom</th><th>Pytania</th><th>Poprawne odpowiedzi</th></tr>
    ${BANDS.map(([lo,hi,l])=>`<tr><td>${l}</td><td>${lo}–${hi}</td><td>${t.per[l].ok} / ${t.per[l].total}</td></tr>`).join("")}
    </table>
    <p class="legend"><span class="c"></span> — odpowiedź zdającego &nbsp;·&nbsp; ✓ poprawna &nbsp;·&nbsp;
      ✗ błędna (<span class="d"></span> obok — poprawna odpowiedź) &nbsp;·&nbsp; — brak odpowiedzi<br>
      Odpowiedzi otwarte wpisane pismem odręcznym.${anyOv?" Gwiazdka (*) — odpowiedź otwarta zaliczona ręcznie.":""}<br>
      Wypełniono w wersji interaktywnej testu.</p>
  </div></div>`;
  for(let pi=0;pi<DATA.pages.length;pi++){
    const pg=DATA.pages[pi];
    let ov="";
    for(const q of Q){
      const a=answered(q),ok=isCorrect(q);
      if(q.page===pi){
        const mk=a?(ok?"✓"+(S.ov[q.id]?"*":""):"✗"):"—";
        const cls=a?(ok?"ok":"bad"):"none";
        ov+=`<span class="mk ${cls}" style="left:${(q.mark.x*100).toFixed(2)}%;top:${(q.mark.y*100).toFixed(2)}%">${mk}</span>`;
      }
      if(q.type==="mcq"&&a){
        const chosen=q.options.find(o=>o.k===S.ans[q.id]);
        if(chosen&&chosen.page===pi)ov+=circ(chosen.bbox,"");
        if(!ok){
          const corr=q.options.find(o=>o.k===q.answer);
          if(corr&&corr.page===pi)ov+=circ(corr.bbox,"corr");
        }
      }
      if(q.type==="open"&&q.blank&&q.blank.page===pi){
        const b=q.blank.bbox;
        if(a){
          const txt=String(S.ans[q.id]).replace(/\s+/g," ").trim();
          const fs=txt.length>42?1.7:2.4;
          ov+=`<span class="hand" lang="pl" style="left:${(b[0]*100).toFixed(2)}%;bottom:${(100-b[3]*100+0.15).toFixed(2)}%;font-size:${fs}cqw">${esc(txt)}</span>`;
        }
        if(!ok)ov+=`<span class="pnote" lang="pl" style="left:${(b[0]*100).toFixed(2)}%;top:${(b[3]*100+0.25).toFixed(2)}%">popr.: ${esc(q.display)}</span>`;
      }
    }
    html+=`<div class="sheet page"><div class="pgwrap"><img src="${pg.src}" alt="Strona ${pi+1} testu"><div>${ov}</div></div></div>`;
  }
  $("#report").innerHTML=html;
}
function circ(b,extra){
  const px=0.9,py=0.45;
  return `<span class="circ ${extra}" style="left:${(b[0]*100-px).toFixed(2)}%;top:${(b[1]*100-py).toFixed(2)}%;
    width:${((b[2]-b[0])*100+2*px).toFixed(2)}%;height:${((b[3]-b[1])*100+2*py).toFixed(2)}%"></span>`;
}
window.addEventListener("beforeprint",()=>{if(!$("#report").innerHTML)buildReport()});
/* ---------- actions ---------- */
function go(i){S.idx=Math.min(N-1,Math.max(0,i));save();render();window.scrollTo(0,0);
  announce("Вопрос "+(S.idx+1)+" из "+N)}
function finish(){
  const t=tally();
  const end=()=>{S.done=true;save();show("results")};
  if(t.ansd<N)ask(`Без ответа: ${N-t.ansd} из ${N} вопросов. Завершить всё равно?`,"Завершить",end);
  else end();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  const q=Q[S.idx];
  switch(act){
    case"a+":setScale(S.scale+0.15);break;
    case"a-":setScale(S.scale-0.15);break;
    case"start":case"continue":show("quiz");break;
    case"back-quiz":S.done=false;save();show("quiz");break;
    case"back-question":show("quiz");break;
    case"home":show("start");break;
    case"results":S.done=true;save();show("results");break;
    case"reset":ask("Точно сбросить все ответы?","Сбросить",()=>{S={...S,ans:{},ov:{},idx:0,done:false};save();show("start")});break;
    case"pick":S.ans[q.id]=b.dataset.k;save();render();break;
    case"dia":{const ta=$("#openinp");if(ta){const p=ta.selectionStart??ta.value.length;
      ta.value=ta.value.slice(0,p)+b.dataset.c+ta.value.slice(p);
      ta.setSelectionRange(p+1,p+1);ta.focus();S.ans[q.id]=ta.value;save();}break}
    case"prev":go(S.idx-1);break;
    case"next":go(S.idx+1);break;
    case"finish":finish();break;
    case"grid":show("grid");break;
    case"jump":S.idx=+b.dataset.i;save();show(S.done?"review":"quiz");break;
    case"review":show("review");break;
    case"rprev":case"rnext":{const ids=reviewIds();let p=ids.indexOf(S.idx);
      if(p<0)p=0;else p+=(act==="rnext"?1:-1);
      if(p>=0&&p<ids.length){S.idx=ids[p];save();render();window.scrollTo(0,0)}break}
    case"override":S.ov[q.id]=!S.ov[q.id];save();render();break;
    case"report":S.done=true;save();show("report");break;
    case"rep-theme":S.repLight=b.dataset.t==="light";save();buildReport();break;
    case"print":try{window.print()}catch(err){announce("Печать недоступна в этом окружении")}break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="openinp"){S.ans[Q[S.idx].id]=e.target.value;save();
    const t=tally();const f=$(".pfill");if(f)f.style.width=(t.ansd/N*100)+"%";}
  if(e.target.id==="nm"){S.name=e.target.value;save()}
  if(e.target.id==="onlyerr"){
    onlyErrors=e.target.checked;
    let ids=reviewIds();
    if(!ids.length){onlyErrors=false;ids=reviewIds();announce("Ошибок нет")}
    if(!ids.includes(S.idx))S.idx=ids[0];
    save();render();
  }
});
document.addEventListener("keydown",e=>{
  if($("#modal").style.display==="flex"){if(e.key==="Escape")closeModal();return}
  if(e.target instanceof Element&&e.target.matches("textarea,input"))return;
  const right=e.key==="ArrowRight"||e.key==="Right",left=e.key==="ArrowLeft"||e.key==="Left";
  if(view==="quiz"){
    const q=Q[S.idx];
    const map={"a":"a","b":"b","c":"c","1":"a","2":"b","3":"c","ф":"a","и":"b","с":"c"};
    const k=map[e.key.toLowerCase()];
    if(k&&q.type==="mcq"){S.ans[q.id]=k;save();render();return}
    if(e.key==="Enter"){
      if(e.target.closest("button")&&!e.target.closest(".opt"))return;
      e.preventDefault();if(S.idx<N-1)go(S.idx+1);return}
    if(right){e.preventDefault();if(S.idx<N-1)go(S.idx+1);return}
    if(left){e.preventDefault();go(S.idx-1);return}
  }
  if(view==="review"){
    if(right){e.preventDefault();$('[data-act="rnext"]')?.click();return}
    if(left){e.preventDefault();$('[data-act="rprev"]')?.click();return}
  }
});
/* ---------- demo hooks (for automated testing) ---------- */
if(params.has("demo")){
  const mode=params.get("demo");
  for(const q of Q){
    const right=q.type==="mcq"?q.answer:q.accept[0];
    if(mode==="key")S.ans[q.id]=right;
    else if(mode==="mix"){
      if(q.id%7===0)continue;
      if(q.id%3===0){S.ans[q.id]=q.type==="mcq"?({a:"b",b:"c",c:"a"})[q.answer]:"zły przykład"}
      else S.ans[q.id]=right;
    }
  }
  S.done=true;S.name="Misha Belov (demo)";
}
/* ---------- init ---------- */
if(params.get("theme")==="light")S.repLight=true;
if(params.get("theme")==="dark")S.repLight=false;
setScale(S.scale);
if(params.get("view")==="report")show("report");
else if(params.get("view")==="results")show("results");
else show(S.done?"results":"start");
</script>
<!--BODY-END-->
</body>
</html>
